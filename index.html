<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University of East Florida | 100% Online Global Campus</title>
  <meta name="description" content="Official Portal for University of East Florida (UEF). 100% Online accredited theoretical degree programs, instant marksheets upload, and global admissions.">
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg">
  <style>
    /* Premium Loading Screen Styles */
    #initial-loader {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #0d090a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }
    .loader-logo {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      animation: pulse-logo 2s infinite ease-in-out;
      margin-bottom: 20px;
    }
    .loader-text {
      color: #d4af37;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse-text 2s infinite ease-in-out;
    }
    @keyframes pulse-logo {
      0% { transform: scale(0.95); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
      50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(212, 175, 55, 0.8); }
      100% { transform: scale(0.95); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
    }
    @keyframes pulse-text {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Initial Loading Screen (Destroyed when React Hydrates) -->
    <div id="initial-loader">
      <img src="assets/logo.jpg" alt="UEF Logo" class="loader-logo" />
      <div class="loader-text">Loading Portal...</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
