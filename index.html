<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University of East Florida | 100% Online Global Campus</title>
  <meta name="description" content="Official Portal for University of East Florida (UEF). 100% Online accredited theoretical degree programs, instant marksheets upload, and global admissions.">
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg">
  <style>
    /* Premium Light Loading Screen Styles */
    #initial-loader {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #ffffff 0%, #fdf9ee 60%, #f5efe0 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: 'Times New Roman', serif;
    }
    .loader-logo {
      width: 110px;
      height: 110px;
      border-radius: 16px;
      border: 2px solid #d4af37;
      box-shadow: 0 14px 35px rgba(212, 175, 55, 0.3), 0 0 25px rgba(255, 255, 255, 0.9);
      animation: centerLogoZoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      margin-bottom: 20px;
      background: #ffffff;
      object-fit: cover;
    }
    .loader-text {
      color: #78350f;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      animation: pulse-text 1.8s infinite ease-in-out;
    }
    @keyframes centerLogoZoomIn {
      0% { opacity: 0; transform: scale(0.2); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse-text {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Initial Loading Screen (Destroyed when React Hydrates) -->
    <div id="initial-loader">
      <img src="assets/logo.jpg" alt="UEF Logo" class="loader-logo" />
      <div class="loader-text">Loading Portal...</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
